[project]
name = "nav-rag-llamaindex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravi", email = "ravi5679@yahoo.co.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "langsmith>=0.14.11",
    "llama-index>=0.14.25",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-lancedb>=0.6.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
link-mode = "copy"
package = false   # an app run with uvicorn, not an installable library

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
