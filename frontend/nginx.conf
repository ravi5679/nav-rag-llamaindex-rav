# Rendered by the nginx image's envsubst at start-up (see Dockerfile).
# ${API_KEY} comes from the container environment (docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads + slow embedding calls
    client_max_body_size 50m;

    # API: the browser only ever talks to this origin, so no CORS is needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-API-Key "${API_KEY}";   # key never reaches the browser
        proxy_read_timeout 300s;
    }

    # React Router: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
